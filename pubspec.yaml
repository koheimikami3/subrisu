name: subrisu
description: An app to manage subscriptions.

publish_to: 'none' 

version: 2.8.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  app_settings: ^5.1.1
  app_tracking_transparency: ^2.0.7
  cloud_firestore: ^6.10.2
  cupertino_icons: ^1.0.2
  dotted_border: ^2.0.0+3
  envied: ^1.1.1
  firebase_analytics: ^12.6.1
  firebase_app_check: ^0.4.9
  firebase_auth: ^6.7.1
  firebase_core: ^4.15.2
  firebase_crashlytics: ^5.4.1
  firebase_messaging: ^16.7.1
  firebase_remote_config: ^6.7.1
  flutter_native_splash: ^2.2.16
  flutter_riverpod: ^2.4.7
  flutter_screenutil: ^5.5.4
  freezed_annotation: ^2.2.0
  google_mobile_ads: ^9.0.0
  in_app_review: ^2.0.6
  intl: any
  keyboard_actions: ^4.2.0
  package_info_plus: ^10.2.1
  pedantic_mono: ^1.20.1
  pull_down_button: ^0.9.3
  purchases_flutter: ^10.7.0
  riverpod_annotation: ^2.3.1
  share_plus: ^13.3.0
  shared_preferences: ^2.0.15
  timezone: ^0.9.0
  url_launcher: ^6.3.1
  version: ^3.0.2
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.2
  envied_generator: ^1.1.1
  flutter_gen_runner: ^5.2.0
  freezed: ^2.3.3
  json_serializable: ^6.5.4
  riverpod_generator: ^2.1.5

flutter_native_splash:
  image: 'images/splash.png'
  color: '#ffffff'

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - images/other_apps/
    - images/subscription/
